<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <title>Achromatopsia Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: black; font-family: system-ui, sans-serif; }
    #video { display: none; }
    #canvas { width: 100vw; height: 100vh; object-fit: cover; display: block; }
    #error {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      color: #ff6b6b;
      background: rgba(0,0,0,0.7);
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      display: none;
    }
    #debug-hud {
      position: absolute;
      top: 10px;
      left: 10px;
      max-width: 60vw;
      color: #fff;
      background: rgba(0,0,0,0.6);
      padding: 6px 10px;
      font: 500 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      border-radius: 6px;
      white-space: pre;
      pointer-events: none;
      z-index: 30;
    }
    #debug-hud[hidden] { display: none; }
    .controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      z-index: 10;
    }
    .pill {
      padding: 7px 14px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.5);
      color: #999;
      font: 600 13px/1.2 system-ui, sans-serif;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      white-space: nowrap;
    }
    .pill:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    .pill:active { background: rgba(255,255,255,0.15); }
    .pill.on { border-color: rgba(255,255,255,0.7); color: #fff; }
    .pill.hidden { display: none; }
    .pill-gear {
      padding: 7px 10px;
      font-size: 16px;
      line-height: 1;
    }
    #settings-panel {
      position: absolute;
      right: 10px;
      background: rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 12px 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
      min-width: 240px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .settings-row label {
      color: #ccc;
      font-size: 12px;
      white-space: nowrap;
      min-width: 118px;
    }
    .settings-row .val {
      min-width: 36px;
      text-align: right;
      color: #ccc;
      font-size: 12px;
    }
    .settings-row input[type=range] {
      flex: 1;
      accent-color: #aaa;
    }
    .settings-row select {
      flex: 1;
      background: rgba(255,255,255,0.1);
      color: #ccc;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
    }
    #sliders {
      position: absolute;
      bottom: 20px;
      left: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
    }
    .slider-row {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.55);
      padding: 8px 12px;
      border-radius: 8px;
    }
    .slider-row label {
      color: #ccc;
      font-size: 12px;
      white-space: nowrap;
      min-width: 64px;
    }
    .slider-row .val {
      min-width: 48px;
      text-align: right;
    }
    .slider-row input[type=range] {
      flex: 1;
      accent-color: #aaa;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="error" role="alert"></div>
  <div id="debug-hud" role="status" aria-live="off" hidden></div>
  <div class="controls">
    <button type="button" id="btn-gray" class="pill on" aria-pressed="true" title="Turn off to see the camera in full color">Grayscale</button>
    <button type="button" id="btn-blur" class="pill on" aria-pressed="true">Blur</button>
    <button type="button" id="btn-freeze" class="pill" aria-pressed="false" title="Freeze the current frame">Freeze</button>
    <button type="button" id="btn-photo" class="pill hidden" title="Save the current frame as a photo">Photo</button>
    <button type="button" id="btn-et" class="pill on hidden" aria-pressed="true" title="Simulates glare / photophobia in bright conditions">Glare</button>
    <button type="button" id="btn-fs" class="pill hidden" aria-pressed="false" title="Toggle fullscreen mode">Fullscreen</button>
    <button type="button" id="btn-settings" class="pill pill-gear" aria-pressed="false" aria-haspopup="true" aria-expanded="false" title="Settings">&#x2699;</button>
  </div>
  <div id="settings-panel">
    <div class="settings-row">
      <label id="label-gray-type">Grayscale type</label>
      <select id="gray-mode">
        <option value="scotopic" selected>Science-based</option>
        <option value="rec601">Plain B&amp;W</option>
      </select>
    </div>
    <div class="settings-row">
      <label id="label-language">Language</label>
      <select id="lang-select">
        <option value="auto" selected>System default</option>
        <option value="en">English</option>
        <option value="cs">Czech</option>
      </select>
    </div>
    <div id="cam-row" class="settings-row" style="display:none">
      <label id="label-camera">Camera</label>
      <select id="cam-select"></select>
    </div>
  </div>
  <div id="sliders">
    <div id="blur-row" class="slider-row" style="display:flex">
      <label id="label-sharpness">Sharpness</label>
      <input type="range" id="blur-slider" min="50" max="300" value="100" step="25">
      <label id="blur-val" class="val">0.100</label>
    </div>
  </div>
  <script>
    const VERT_SRC = `
attribute vec2 aPos;
varying vec2 vTexCoord;
void main() {
    vTexCoord = aPos * 0.5 + 0.5;
    gl_Position = vec4(aPos, 0.0, 1.0);
}`;

    // Source-prep / passthrough shader: samples uSrc, optionally flips the
    // y axis (true for the upside-down video texture, false for FBOs that
    // are already in canvas orientation), and optionally folds in
    // grayscale conversion. Bilinear MIN_FILTER on the source texture
    // doubles this as a clean 2x2 box downsample when the output is
    // exactly half the source resolution.
    const PREP_FRAG_SRC = `
precision mediump float;
uniform sampler2D uSrc;
uniform bool uGrayscale;
uniform int uGrayMode;
uniform bool uFlipY;
varying vec2 vTexCoord;

vec3 srgbToLinear(vec3 c) {
    vec3 lo = c / 12.92;
    vec3 hi = pow((c + 0.055) / 1.055, vec3(2.4));
    return mix(lo, hi, step(0.04045, c));
}

float linearToSrgb(float c) {
    float lo = 12.92 * c;
    float hi = 1.055 * pow(c, 1.0 / 2.4) - 0.055;
    return mix(lo, hi, step(0.0031308, c));
}

void main() {
    vec2 uv = vTexCoord;
    if (uFlipY) uv.y = 1.0 - uv.y;
    vec4 c = texture2D(uSrc, uv);
    if (uGrayscale) {
        float lum;
        if (uGrayMode == 0) {
            vec3 lin = srgbToLinear(c.rgb);
            lum = linearToSrgb(dot(lin, vec3(0.007, 0.519, 0.474)));
        } else {
            lum = dot(c.rgb, vec3(0.299, 0.587, 0.114));
        }
        c = vec4(vec3(lum), 1.0);
    }
    gl_FragColor = c;
}`;

    // Separable Gaussian blur. Each off-center "tap" in this shader is a
    // *bilinear* sample positioned between two adjacent unit-pixel
    // offsets, weighted by the sum of the two underlying Gaussian
    // weights. The GPU's hardware bilinear filter computes the same
    // weighted blend a pair of point samples would, for the cost of one
    // fetch -- so MAX_BLUR_TAPS_HALF=6 paired taps reach 12 unit pixels
    // out from the center while costing only 13 texture fetches per
    // pixel per pass (1 center + 6*2 off-center). That doubles the
    // kernel's reach vs naive unit-spaced sampling at the same shader
    // cost. Weights and offsets are baked per-frame in JS from the
    // current sigma; pairs whose underlying Gaussian weights both fall
    // below the cutoff get a zero weight, so the corresponding fetch
    // multiplies by zero (we still run the full unrolled loop because
    // a static loop bound is simpler than a dynamic one and the
    // wasted work is well below the noise floor at this kernel size).
    const MAX_BLUR_TAPS_HALF = 6;
    // Precision matters here: the final V pass crosses resolutions
    // (sources at L-level, renders at full canvas), so vTexCoord at
    // adjacent output rows differs by a fraction of a source texel.
    // At mediump (16-bit half-float on phones) those tiny deltas
    // quantize to the same value across runs of adjacent output rows,
    // and you get visible horizontal banding wherever the quantized
    // bucket boundary falls. highp keeps the deltas distinct. Fragment-
    // shader highp is optional in WebGL 1, but supported on every GPU
    // we actually care about; the call site feature-detects and falls
    // back to mediump on the rare device without it.
    const BLUR_FRAG_SRC = (precision) => `
precision ${precision} float;
uniform sampler2D uSrc;
uniform vec2 uTexelStep;
uniform float uWeights[${MAX_BLUR_TAPS_HALF + 1}];
uniform float uOffsets[${MAX_BLUR_TAPS_HALF}];
varying vec2 vTexCoord;

void main() {
    vec4 sum = texture2D(uSrc, vTexCoord) * uWeights[0];
    for (int i = 1; i <= ${MAX_BLUR_TAPS_HALF}; i++) {
        float off = uOffsets[i - 1];
        sum += texture2D(uSrc, vTexCoord + uTexelStep * off) * uWeights[i];
        sum += texture2D(uSrc, vTexCoord - uTexelStep * off) * uWeights[i];
    }
    gl_FragColor = sum;
}`;

    const DS_FRAG_SRC = `
precision mediump float;
uniform sampler2D uSrc;
uniform vec2 uSrcSize;
void main() {
    vec2 cellSize = vec2(16.0, 16.0);
    vec2 base = floor(gl_FragCoord.xy) * cellSize;
    float total = 0.0;
    float count = 0.0;
    for (int y = 0; y < 16; y++) {
        for (int x = 0; x < 16; x++) {
            vec2 px = base + vec2(float(x), float(y)) + 0.5;
            if (px.x < uSrcSize.x && px.y < uSrcSize.y) {
                vec4 c = texture2D(uSrc, px / uSrcSize);
                total += dot(c.rgb, vec3(0.2126, 0.7152, 0.0722));
                count += 1.0;
            }
        }
    }
    float avg = total / max(count, 1.0);
    gl_FragColor = vec4(avg, avg, avg, 1.0);
}`;

    const I18N = {
      en: {
        title: 'Achromatopsia Simulator',
        grayscale: 'Grayscale',
        grayscaleTitle: 'Turn off to see the camera in full color',
        blur: 'Blur',
        freeze: 'Freeze',
        freezeTitle: 'Freeze the current frame',
        photo: 'Photo',
        photoTitle: 'Save the current frame as a photo',
        glare: 'Glare',
        glareTitle: 'Simulates glare / photophobia in bright conditions',
        settingsTitle: 'Settings',
        grayType: 'Grayscale type',
        grayScience: 'Science-based',
        grayPlain: 'Plain B&W',
        camera: 'Camera',
        sharpness: 'Sharpness',
        errWebGL: 'WebGL not supported. Try Chrome or Safari.',
        errCameraUnsupported: 'Camera access not supported. Try Chrome or Safari.',
        errCameraFailed: 'Camera failed: {0}',
        errSwitchFailed: 'Camera switch failed: {0}',
        errShareFailed: 'Sharing failed.',
        langLabel: 'Language',
        langAuto: 'System default',
        langEn: 'English',
        langCs: 'Czech',
        fullscreen: 'Fullscreen',
        fullscreenTitle: 'Toggle fullscreen mode',
      },
      cs: {
        title: 'Simulátor achromatopsie',
        grayscale: 'Stupně šedi',
        grayscaleTitle: 'Vypněte pro barevný obraz z kamery',
        blur: 'Rozmazání',
        freeze: 'Zmrazit',
        freezeTitle: 'Zmrazit aktuální snímek',
        photo: 'Foto',
        photoTitle: 'Uložit aktuální snímek jako fotografii',
        glare: 'Oslnění',
        glareTitle: 'Simuluje oslnění při jasném osvětlení',
        settingsTitle: 'Nastavení',
        grayType: 'Typ stupňů šedi',
        grayScience: 'Vědecky podložené',
        grayPlain: 'Obyčejná černobílá',
        camera: 'Kamera',
        sharpness: 'Ostrost',
        errWebGL: 'WebGL není podporován. Zkuste Chrome nebo Safari.',
        errCameraUnsupported: 'Přístup ke kameře není podporován. Zkuste Chrome nebo Safari.',
        errCameraFailed: 'Kamera selhala: {0}',
        errSwitchFailed: 'Přepnutí kamery selhalo: {0}',
        errShareFailed: 'Sdílení selhalo.',
        langLabel: 'Jazyk',
        langAuto: 'Podle systému',
        langEn: 'Angličtina',
        langCs: 'Čeština',
        fullscreen: 'Celá obrazovka',
        fullscreenTitle: 'Přepnout režim celé obrazovky',
      },
    };

    const LOCALE_STORAGE_KEY = 'achromatopsia-simulator-locale';
    const PREFS_STORAGE_KEY = 'achromatopsia-simulator-prefs';

    function loadPrefs() {
      try {
        const raw = localStorage.getItem(PREFS_STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { /* private mode or corrupt */ }
      return null;
    }

    function savePrefs(prefs) {
      try { localStorage.setItem(PREFS_STORAGE_KEY, JSON.stringify(prefs)); }
      catch (e) { /* private mode */ }
    }

    function readLocaleOverride() {
      try {
        const v = localStorage.getItem(LOCALE_STORAGE_KEY);
        if (v === 'en' || v === 'cs') return v;
      } catch (e) { /* private mode, disabled storage */ }
      return null;
    }

    function getEffectiveLocale() {
      const override = readLocaleOverride();
      if (override) return override;
      const tags = navigator.languages?.length ? navigator.languages : [navigator.language || 'en'];
      const wantsCs = tags.some(tag => String(tag).split('-')[0].toLowerCase() === 'cs');
      return wantsCs ? 'cs' : 'en';
    }

    /** Decode location.hash into a flat object of string values. Empty
     *  hash yields {}. Unknown keys are kept (caller decides what to
     *  do with them). Only the last occurrence of a repeated key wins. */
    function parseHashParams() {
      const raw = (location.hash || '').replace(/^#/, '');
      if (!raw) return {};
      const params = new URLSearchParams(raw);
      const out = {};
      for (const [k, v] of params) out[k] = v;
      return out;
    }

    const sim = {
      video: document.getElementById('video'),
      canvas: document.getElementById('canvas'),
      errorDiv: document.getElementById('error'),
      debugEl: document.getElementById('debug-hud'),
      btnGray: document.getElementById('btn-gray'),
      btnET: document.getElementById('btn-et'),
      btnFS: document.getElementById('btn-fs'),
      btnSettings: document.getElementById('btn-settings'),
      settingsPanel: document.getElementById('settings-panel'),
      grayModeSelect: document.getElementById('gray-mode'),
      btnBlur: document.getElementById('btn-blur'),
      btnFreeze: document.getElementById('btn-freeze'),
      btnPhoto: document.getElementById('btn-photo'),
      blurRow: document.getElementById('blur-row'),
      blurSlider: document.getElementById('blur-slider'),
      blurVal: document.getElementById('blur-val'),
      camRow: document.getElementById('cam-row'),
      camSelect: document.getElementById('cam-select'),
      langSelect: document.getElementById('lang-select'),
      stream: null,
      track: null,
      rafId: null,
      gl: null,
      prepProgram: null,
      prepUniforms: null,
      blurProgram: null,
      blurUniforms: null,
      blurMaxLevel: 4,
      blurSrcFbos: [],
      blurPingFbos: [],
      glTexture: null,
      texSourceCanvas: null,
      texSourceCtx: null,
      useCanvasWorkaround: false,
      _glLifecycleBound: false,
      caps: null,
      supportsET: false,
      supportsISO: false,
      aperture: 1.8,
      grayscaleOn: true,
      grayMode: 'scotopic',
      etOn: true,
      manualET: null,
      blurOn: true,
      blurVA: 0.10,
      frozen: false,
      settingsOpen: false,
      cameras: [],
      cameraIndex: -1,
      _preferredCameraDeviceId: null,
      strings: I18N.en,
      dsProgram: null,
      dsUniforms: null,
      dsChain: [],
      meterFrameCounter: 0,
      METER_EVERY_N: 10,
      AE_TARGET: 0.35,
      AE_DAMPING: 0.15,
      AE_LUM_DEADBAND: 0.02,
      _etApplyPending: false,
      _wakeLock: null,
      _resumePending: false,
      _lastErrorKey: null,
      _lastErrorParams: null,
      _debugOn: false,
      _debugIntervalId: null,
      _lastMeasuredLum: -1,
      _fpsCount: 0,
      _fpsT0: 0,
      _fpsCurrent: 0,

      initGL() {
        const gl = this.canvas.getContext('webgl', { antialias: false, depth: false, stencil: false });
        if (!gl) return false;
        this.gl = gl;

        // One full-screen quad shared by every program; bound once and
        // never rebound since nothing else touches ARRAY_BUFFER.
        const quad = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

        const vs = this._compileShader(gl.VERTEX_SHADER, VERT_SRC, 'Vertex shader');
        if (!vs) return false;

        const highp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
        const blurPrecision = (highp && highp.precision > 0) ? 'highp' : 'mediump';
        if (blurPrecision !== 'highp') {
          console.warn('Fragment-shader highp unavailable; blur may show banding on cross-resolution passes.');
        }

        const prep = this._buildProgram(vs, PREP_FRAG_SRC, 'Prep',
          ['uSrc', 'uGrayscale', 'uGrayMode', 'uFlipY']);
        if (!prep) return false;
        const blur = this._buildProgram(vs, BLUR_FRAG_SRC(blurPrecision), 'Blur',
          ['uSrc', 'uTexelStep', 'uWeights', 'uOffsets']);
        if (!blur) return false;
        const ds = this._buildProgram(vs, DS_FRAG_SRC, 'Downsample',
          ['uSrc', 'uSrcSize']);
        if (!ds) return false;

        this.prepProgram = prep.program;
        this.prepUniforms = prep.uniforms;
        this.blurProgram = blur.program;
        this.blurUniforms = blur.uniforms;
        this.dsProgram = ds.program;
        this.dsUniforms = ds.uniforms;

        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        this.glTexture = tex;

        if (!this._glLifecycleBound) {
          this._glLifecycleBound = true;
          this.canvas.addEventListener('webglcontextlost', (e) => {
            e.preventDefault();
            if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
            this.blurSrcFbos = [];
            this.blurPingFbos = [];
            this.dsChain = [];
          });
          this.canvas.addEventListener('webglcontextrestored', () => {
            this.initGL();
            if (this.video.readyState >= 2) {
              this.resetVideoTextureWorkaround();
              this.detectTexImageVideoSupport();
              this.updateCanvasSize();
            }
            this.processFrame();
          });
        }

        return true;
      },

      _compileShader(type, src, label) {
        const gl = this.gl;
        const sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
          console.error(label + ':', gl.getShaderInfoLog(sh));
          return null;
        }
        return sh;
      },

      /** Compile the fragment shader, link with the shared vertex shader,
       *  fetch the requested uniform locations, wire the shared aPos
       *  attribute to the already-bound quad buffer, and pre-set uSrc
       *  to texture unit 0. Returns { program, uniforms } or null. */
      _buildProgram(vs, fragSrc, label, uniformNames) {
        const gl = this.gl;
        const fs = this._compileShader(gl.FRAGMENT_SHADER, fragSrc, label + ' shader');
        if (!fs) return null;
        const program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          console.error(label + ' program link:', gl.getProgramInfoLog(program));
          return null;
        }
        const uniforms = {};
        for (const name of uniformNames) uniforms[name] = gl.getUniformLocation(program, name);
        const aPos = gl.getAttribLocation(program, 'aPos');
        if (aPos !== -1) {
          gl.enableVertexAttribArray(aPos);
          gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
        }
        if (uniforms.uSrc) {
          gl.useProgram(program);
          gl.uniform1i(uniforms.uSrc, 0);
        }
        return { program, uniforms };
      },

      /** Allocate two parallel FBO chains at full / half / quarter
       *  resolution: blurSrcFbos hold the prepared (and progressively
       *  downsampled) source, blurPingFbos hold the horizontal-blur
       *  intermediates. We only ever blur at one chosen level per
       *  frame; the level is picked so the per-level sigma stays small
       *  enough for a fixed 13-tap kernel to be a true Gaussian. */
      buildBlurFbos(w, h) {
        const gl = this.gl;
        if (!gl) return;
        const oldSrc = this.blurSrcFbos, oldPing = this.blurPingFbos;
        for (const f of oldSrc.concat(oldPing)) {
          gl.deleteTexture(f.tex);
          gl.deleteFramebuffer(f.fbo);
        }
        this.blurSrcFbos = [];
        this.blurPingFbos = [];
        for (let level = 0; level <= this.blurMaxLevel; level++) {
          const lw = Math.max(1, w >> level);
          const lh = Math.max(1, h >> level);
          this.blurSrcFbos.push(this._allocFbo(lw, lh));
          this.blurPingFbos.push(this._allocFbo(lw, lh));
        }
      },

      _allocFbo(w, h) {
        const gl = this.gl;
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        const fbo = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return { tex, fbo, w, h };
      },

      buildDSChain(w, h) {
        const gl = this.gl;
        if (!gl || !this.dsProgram) return;
        this.dsChain.forEach(level => {
          gl.deleteTexture(level.tex);
          gl.deleteFramebuffer(level.fbo);
        });
        this.dsChain = [];
        let sw = w, sh = h;
        while (sw > 1 || sh > 1) {
          const dw = Math.max(1, Math.ceil(sw / 16));
          const dh = Math.max(1, Math.ceil(sh / 16));
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, dw, dh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
          const fbo = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
          this.dsChain.push({ tex, fbo, w: dw, h: dh, srcW: sw, srcH: sh });
          sw = dw;
          sh = dh;
        }
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      },

      resetVideoTextureWorkaround() {
        this.useCanvasWorkaround = false;
        this.texSourceCanvas = null;
        this.texSourceCtx = null;
      },

      detectTexImageVideoSupport() {
        const gl = this.gl;
        try {
          gl.bindTexture(gl.TEXTURE_2D, this.glTexture);
          while (gl.getError() !== gl.NO_ERROR) { /* drain stale errors */ }
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, this.video);
          if (gl.getError() !== gl.NO_ERROR) {
            this.useCanvasWorkaround = true;
          }
        } catch (e) {
          this.useCanvasWorkaround = true;
        }
        if (this.useCanvasWorkaround) {
          console.log('Using canvas intermediary for video texture upload');
          this.texSourceCanvas = document.createElement('canvas');
          this.texSourceCtx = this.texSourceCanvas.getContext('2d');
        }
      },

      updateCanvasSize() {
        const vw = this.video.videoWidth;
        const vh = this.video.videoHeight;
        if (!vw || !vh) return;
        this.canvas.width = vw;
        this.canvas.height = vh;
        if (this.gl) this.gl.viewport(0, 0, vw, vh);
        if (this.useCanvasWorkaround && this.texSourceCanvas) {
          this.texSourceCanvas.width = vw;
          this.texSourceCanvas.height = vh;
        }
        this.buildBlurFbos(vw, vh);
        this.buildDSChain(vw, vh);
      },

      uploadVideoTexture() {
        const gl = this.gl;
        gl.bindTexture(gl.TEXTURE_2D, this.glTexture);
        if (this.useCanvasWorkaround) {
          const w = this.video.videoWidth;
          const h = this.video.videoHeight;
          this.texSourceCtx.drawImage(this.video, 0, 0, w, h);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, this.texSourceCanvas);
        } else {
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, this.video);
        }
      },

      meterLuminance() {
        const gl = this.gl;
        if (!this.dsProgram || !this.dsChain.length) return -1;

        let srcTex = this.glTexture;
        for (const level of this.dsChain) {
          this._drawQuad(this.dsProgram, srcTex, level.fbo, level.w, level.h, () => {
            gl.uniform2f(this.dsUniforms.uSrcSize, level.srcW, level.srcH);
          });
          srcTex = level.tex;
        }

        const px = new Uint8Array(4);
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);

        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        const vw = this.canvas.width, vh = this.canvas.height;
        if (vw && vh) gl.viewport(0, 0, vw, vh);

        return px[0] / 255;
      },

      processFrame() {
        const gl = this.gl;
        if (!gl || gl.isContextLost()) return;
        if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }

        this.uploadVideoTexture();
        this.renderFrame();
        this._fpsCount++;

        if (this.etOn && this.supportsET) {
          if (++this.meterFrameCounter >= this.METER_EVERY_N) {
            this.meterFrameCounter = 0;
            const lum = this.meterLuminance();
            if (lum >= 0) {
              this._lastMeasuredLum = lum;
              this.autoAdjustET(lum);
            }
          }
        }

        if (!this.frozen) this.rafId = requestAnimationFrame(() => this.processFrame());
      },

      /** Render the most-recently-uploaded video texture to the screen.
       *  Pipeline:
       *    prep  -> srcFbo[0]      grayscale + flip Y at full res
       *    (downsample N times)    pure passthrough; LINEAR filter on the
       *                            source gives a 2x2 box filter for free
       *    blur H -> pingFbo[L]    separable Gaussian, weights baked in JS
       *    blur V -> screen        runs at full canvas resolution while
       *                            still sampling pingFbo[L] -- the 13
       *                            bilinear-tap fetches reconstruct the
       *                            Gaussian-convolved image at full-res
       *                            pixel positions, replacing the naive
       *                            bilinear MAG_FILTER upsample we used
       *                            to do as a separate final pass.
       *
       *  When blur is off (sigma == 0) the pipeline collapses to a single
       *  prep pass straight to the default framebuffer. */
      renderFrame() {
        const gl = this.gl;
        if (!gl || gl.isContextLost() || !this.prepProgram || !this.blurProgram) return;
        const w = this.canvas.width, h = this.canvas.height;
        if (!w || !h) return;

        const sigma = (this.blurOn && this.blurSrcFbos.length) ? this.getBlurSigma() : 0;

        if (sigma <= 0) {
          this._runPrep(this.glTexture, null, w, h, true);
          return;
        }

        const level = this._pickBlurLevel(sigma);
        const sigmaAtLevel = sigma / (1 << level);
        const src0 = this.blurSrcFbos[0];
        this._runPrep(this.glTexture, src0.fbo, src0.w, src0.h, true);

        for (let k = 1; k <= level; k++) {
          const dst = this.blurSrcFbos[k];
          this._runPrep(this.blurSrcFbos[k - 1].tex, dst.fbo, dst.w, dst.h, false);
        }

        const target = this.blurSrcFbos[level];
        const ping = this.blurPingFbos[level];
        this._runBlur(target.tex, target.w, target.h, ping.fbo, ping.w, ping.h, sigmaAtLevel, true);
        this._runBlur(ping.tex, ping.w, ping.h, null, w, h, sigmaAtLevel, false);
      },

      /** Choose the smallest power-of-two downsample level whose
       *  sigma-at-level stays within the bilinear-tap kernel's
       *  effective half-width (the kernel reaches +/-12 unit pixels,
       *  so sigmaCap = 3 still covers ~+/-4 sigma -- 99.99% kernel
       *  mass). The cap is deliberately *not* the kernel's true limit:
       *  picking a less aggressive level means the blur runs on a
       *  larger framebuffer, so the bilinear *upsample* back to full
       *  resolution doesn't have to invent as many pixels and the
       *  visible grid of the downsample chain stops bleeding through.
       *  At default VA 0.10 on a phone in portrait (cover scale ~2.4)
       *  this picks level 1 (1/2 res) instead of level 3 (1/8 res),
       *  which is the practical artifact-killer.
       *
       *  blurMaxLevel determines the absolute floor: VA 0.05 on a
       *  high-DPR phone reaches ~14 internal px, so level 2 is still
       *  needed there. */
      _pickBlurLevel(sigma) {
        const sigmaCap = 3;
        let level = 0;
        let s = sigma;
        while (s > sigmaCap && level < this.blurMaxLevel) {
          s *= 0.5;
          level++;
        }
        return level;
      },

      /** Draw the shared full-screen quad through `program` into `dstFbo`
       *  (or the default framebuffer if null) at `dstW x dstH`. The
       *  caller's `setUniforms` runs after the program is bound but
       *  before the draw, so it can call gl.uniform* without worrying
       *  about which program is active. uSrc is pre-bound to texture
       *  unit 0 at link time. */
      _drawQuad(program, srcTex, dstFbo, dstW, dstH, setUniforms) {
        const gl = this.gl;
        gl.useProgram(program);
        if (setUniforms) setUniforms();
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, srcTex);
        gl.bindFramebuffer(gl.FRAMEBUFFER, dstFbo);
        gl.viewport(0, 0, dstW, dstH);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      },

      _runPrep(srcTex, dstFbo, dstW, dstH, flipY) {
        const gl = this.gl, u = this.prepUniforms;
        this._drawQuad(this.prepProgram, srcTex, dstFbo, dstW, dstH, () => {
          gl.uniform1i(u.uGrayscale, this.grayscaleOn ? 1 : 0);
          gl.uniform1i(u.uGrayMode, this.grayMode === 'scotopic' ? 0 : 1);
          gl.uniform1i(u.uFlipY, flipY ? 1 : 0);
        });
      },

      /** Apply a single (horizontal or vertical) blur pass.
       *
       *  The kernel is defined in *source-texel* space -- one unit
       *  offset in the kernel means one source pixel -- so uTexelStep
       *  references the source dimensions, never the destination's.
       *  When src and dst are the same resolution (the H pass and the
       *  intermediate V passes during the downsample chain) this is the
       *  obvious thing. The interesting case is the *final* V pass,
       *  which we run with src at the L-level resolution but dst at
       *  full canvas resolution: the shader's bilinear taps then
       *  reconstruct the Gaussian-convolved image at full-res pixel
       *  positions from the L-level H-blurred input, replacing the
       *  separate naive bilinear upsample we used to do as a final
       *  prep-shader passthrough. */
      _runBlur(srcTex, srcW, srcH, dstFbo, dstW, dstH, sigma, horizontal) {
        const gl = this.gl, u = this.blurUniforms;
        const { weights, offsets } = this._gaussianWeights(sigma);
        this._drawQuad(this.blurProgram, srcTex, dstFbo, dstW, dstH, () => {
          gl.uniform1fv(u.uWeights, weights);
          gl.uniform1fv(u.uOffsets, offsets);
          if (horizontal) gl.uniform2f(u.uTexelStep, 1 / srcW, 0);
          else            gl.uniform2f(u.uTexelStep, 0, 1 / srcH);
        });
      },

      /** Build a normalised Gaussian kernel collapsed onto bilinear taps.
       *  Returns { weights, offsets } where:
       *    weights[0]      = center weight
       *    weights[1..N]   = paired weight for the k-th bilinear tap
       *                      (applied to both the + and - direction)
       *    offsets[0..N-1] = sub-pixel offset of the k-th paired tap
       *  with N = MAX_BLUR_TAPS_HALF.
       *
       *  Pair k (1-indexed) covers the underlying unit-pixel offsets
       *  (2k-1, 2k); the bilinear sample's offset is the centre of mass
       *  of the two underlying Gaussian weights, and its weight is
       *  their sum. The GPU's hardware bilinear filter then blends the
       *  two adjacent texels in exactly the proportion the unit-spaced
       *  Gaussian would have summed them at -- one fetch, two taps'
       *  worth of mass.
       *
       *  Underlying weights below a 1e-3 cutoff are zeroed before
       *  pairing so faraway taps contribute nothing. If both members of
       *  a pair are zeroed the paired weight is zero too; the offset
       *  then doesn't matter (the fetch is multiplied by zero) so we
       *  pick the pair's nominal centre to keep the value finite. */
      _gaussianWeights(sigma) {
        const halfPairs = MAX_BLUR_TAPS_HALF;
        const halfTaps = halfPairs * 2;
        const cutoff = 1e-3;
        const inv2s2 = 1 / (2 * sigma * sigma);

        const g = new Float32Array(halfTaps + 1);
        for (let i = 0; i <= halfTaps; i++) {
          const v = Math.exp(-(i * i) * inv2s2);
          g[i] = (i === 0 || v >= cutoff) ? v : 0;
        }

        const weights = new Float32Array(halfPairs + 1);
        const offsets = new Float32Array(halfPairs);
        weights[0] = g[0];
        for (let k = 1; k <= halfPairs; k++) {
          const a = g[2 * k - 1];
          const b = g[2 * k];
          const wp = a + b;
          weights[k] = wp;
          offsets[k - 1] = wp > 0 ? (a * (2 * k - 1) + b * (2 * k)) / wp : (2 * k - 0.5);
        }

        let sum = weights[0];
        for (let k = 1; k <= halfPairs; k++) sum += 2 * weights[k];
        const inv = 1 / sum;
        for (let k = 0; k <= halfPairs; k++) weights[k] *= inv;

        return { weights, offsets };
      },

      async start() {
        if (!this.initGL()) {
          this.showError('errWebGL');
          return;
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          this.showError('errCameraUnsupported');
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
          });
          await this.attachAndPrepareStream(stream);
          await this.enumerateCameras();
          this.processFrame();
          this.acquireWakeLock();
        } catch (err) {
          this.showError('errCameraFailed', err.message);
        }
      },

      async applyStreamMetadataPipeline() {
        this.updateCanvasSize();
        this.resetVideoTextureWorkaround();
        this.detectTexImageVideoSupport();
        this.detectCapabilities();
        if (this.etOn && this.supportsET) await this.applyET();
      },

      /**
       * Assign stream, wait for loadedmetadata, then run canvas/WebGL/camera pipeline.
       * Ensures enumerateCameras → switchCamera finishes sizing the *current* track before callers continue.
       */
      async attachAndPrepareStream(stream) {
        this.stream = stream;
        this.track = stream.getVideoTracks()[0];
        this.video.onloadedmetadata = null;
        await new Promise((resolve, reject) => {
          const onMeta = async () => {
            try {
              await this.applyStreamMetadataPipeline();
              resolve();
            } catch (e) {
              reject(e);
            }
          };
          this.video.addEventListener('loadedmetadata', onMeta, { once: true });
          this.video.srcObject = stream;
          this.video.play().catch(reject);
        });
      },

      detectCapabilities() {
        this.supportsET = false;
        this.supportsISO = false;
        this.caps = this.track?.getCapabilities ? this.track.getCapabilities() : null;
        if (this.caps) {
          console.log('Camera capabilities:', this.caps);
          this.supportsET = !!(this.caps.exposureMode?.includes('manual') && this.caps.exposureTime);
          this.supportsISO = !!this.caps.iso;
        }

        this.applyETUIState();

        if (!this.supportsET) {
          this.manualET = null;
          void this.resetExposure();
        }

        this.aperture = 1.8;
        console.log('Aperture (assumed):', this.aperture);
        if (this.supportsISO && this.supportsET) {
          console.log('Fixed ISO for constraints:', this.getFixedISO());
        }
      },

      async enumerateCameras() {
        if (!navigator.mediaDevices?.enumerateDevices) return;
        const devices = await navigator.mediaDevices.enumerateDevices();
        const allVideo = devices.filter(d => d.kind === 'videoinput');

        this.cameras = allVideo.filter(d => {
          if (typeof d.getCapabilities === 'function') {
            const caps = d.getCapabilities();
            if (caps.facingMode?.length) return caps.facingMode.includes('environment');
          }
          return /back|environment/i.test(d.label);
        });
        if (!this.cameras.length) this.cameras = allVideo;

        this.cameras.sort((a, b) => {
          const idA = a.label.match(/camera\s*(\d+)/i);
          const idB = b.label.match(/camera\s*(\d+)/i);
          return (idA ? +idA[1] : 999) - (idB ? +idB[1] : 999);
        });

        const currentId = this.track?.getSettings()?.deviceId;
        this.cameraIndex = this.cameras.findIndex(c => c.deviceId === currentId);
        if (this.cameraIndex === -1) this.cameraIndex = 0;

        if (this.cameras.length > 1) {
          this.camRow.style.display = 'flex';
          this.populateCameraSelect();
        }

        let targetIndex = 0;
        if (this._preferredCameraDeviceId) {
          const prefIdx = this.cameras.findIndex(c => c.deviceId === this._preferredCameraDeviceId);
          if (prefIdx !== -1) targetIndex = prefIdx;
        }
        if (this.cameraIndex !== targetIndex) await this.switchCamera(targetIndex);
      },

      populateCameraSelect() {
        this.camSelect.innerHTML = '';
        this.cameras.forEach((cam, i) => {
          const opt = document.createElement('option');
          opt.value = i;
          const label = cam.label || ('Camera ' + (i + 1));
          opt.textContent = label.length > 40 ? label.substring(0, 40) + '\u2026' : label;
          if (i === this.cameraIndex) opt.selected = true;
          this.camSelect.appendChild(opt);
        });
      },

      async switchCamera(targetIndex) {
        if (this.cameras.length < 2) return;
        this.cameraIndex = targetIndex !== undefined
          ? targetIndex
          : (this.cameraIndex + 1) % this.cameras.length;
        const deviceId = this.cameras[this.cameraIndex].deviceId;
        if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
        if (this.stream) {
          this.stream.getTracks().forEach(t => t.stop());
          this.stream = null;
          this.track = null;
          this.video.srcObject = null;
        }
        for (let attempt = 0; attempt < 3; attempt++) {
          await new Promise(r => setTimeout(r, 300 * (attempt + 1)));
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { deviceId: { exact: deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } }
            });
            await this.attachAndPrepareStream(stream);
            this.camSelect.value = this.cameraIndex;
            this.persistPrefs();
            this.processFrame();
            return;
          } catch (err) {
            if (attempt === 2) this.showError('errSwitchFailed', err.message);
          }
        }
      },

      onCameraSelectChange() {
        const idx = parseInt(this.camSelect.value, 10);
        if (idx !== this.cameraIndex) this.switchCamera(idx);
      },

      /** ISO applied with manual ET when the camera supports it; matches S22 calibration. */
      FIXED_ISO: 400,

      getFixedISO() {
        const target = this.FIXED_ISO;
        if (!this.supportsISO || !this.caps?.iso) return target;
        const { min, max } = this.caps.iso;
        return Math.round(Math.max(min, Math.min(target, max)));
      },

      getETFloor() {
        const C_EMP = 30.86;
        const E_OVERWHELM = 1000;
        const N = this.aperture;
        const iso = this.getFixedISO();
        return N * N * C_EMP * 1e6 / (E_OVERWHELM * iso);
      },

      /** Send a manual ET (and ISO when supported) to the camera. Tracks an
       *  in-flight flag so callers can avoid stacking constraint calls. */
      sendManualET(et, label) {
        this.manualET = et;
        const constraint = { exposureMode: 'manual', exposureTime: et };
        if (this.supportsISO) constraint.iso = this.getFixedISO();
        this._etApplyPending = true;
        return this.track.applyConstraints({ advanced: [constraint] })
          .catch(e => console.warn(label + ' failed:', e))
          .finally(() => { this._etApplyPending = false; });
      },

      /** Seed the AE controller. ETs at or below the floor produce the
       *  glare wash-out at ~1000 lux; the controller raises ET above the
       *  floor in dim scenes within ~1-2 s of metering. */
      async applyET() {
        if (!this.track || !this.caps?.exposureTime) return;
        const { min, max } = this.caps.exposureTime;
        const seed = Math.max(min, Math.min(max, Math.round(this.getETFloor())));
        await this.sendManualET(seed, 'Initial ET');
      },

      autoAdjustET(measured) {
        if (!this.caps?.exposureTime || this._etApplyPending) return;
        if (Math.abs(measured - this.AE_TARGET) < this.AE_LUM_DEADBAND) return;
        const { min, max } = this.caps.exposureTime;
        const etFloor = Math.max(min, this.getETFloor());
        const currentET = this.manualET || etFloor;
        const ratio = this.AE_TARGET / Math.max(measured, 0.001);
        const targetET = Math.max(etFloor, Math.min(max, currentET * ratio));
        const logNew = Math.log(currentET) + this.AE_DAMPING * (Math.log(targetET) - Math.log(currentET));
        const newET = Math.max(etFloor, Math.min(max, Math.round(Math.exp(logNew))));
        this.sendManualET(newET, 'Auto ET');
      },

      /** Toggle a pill button's visual + ARIA pressed state together. */
      setPillState(btn, on) {
        btn.classList.toggle('on', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      },

      applyETUIState() {
        this.btnET.classList.toggle('hidden', !this.supportsET);
        this.setPillState(this.btnET, this.supportsET && this.etOn);
      },

      async resetExposure() {
        this.manualET = null;
        if (!this.track?.getCapabilities) return;
        if (!this.caps) this.caps = this.track.getCapabilities();
        if (this.caps.exposureMode?.includes('continuous')) {
          try {
            await this.track.applyConstraints({
              advanced: [{ exposureMode: 'continuous' }]
            });
          } catch (e) { /* best effort */ }
        }
      },

      async toggleET() {
        this.etOn = !this.etOn;
        if (this.etOn) this.meterFrameCounter = 0;
        this.applyETUIState();
        await (this.etOn ? this.applyET() : this.resetExposure());
        this.persistPrefs();
      },

      persistPrefs() {
        const prefs = {
          grayscaleOn: this.grayscaleOn,
          grayMode: this.grayMode,
          blurOn: this.blurOn,
          blurVA: this.blurVA,
          etOn: this.etOn,
        };
        const camDevice = this.cameras[this.cameraIndex];
        if (camDevice) prefs.cameraDeviceId = camDevice.deviceId;
        savePrefs(prefs);
        this.syncURLHash();
      },

      restorePrefs() {
        const p = loadPrefs();
        if (!p) return;
        if (typeof p.grayscaleOn === 'boolean') {
          this.grayscaleOn = p.grayscaleOn;
          this.setPillState(this.btnGray, this.grayscaleOn);
        }
        if (p.grayMode === 'scotopic' || p.grayMode === 'rec601') {
          this.grayMode = p.grayMode;
          this.grayModeSelect.value = p.grayMode;
        }
        if (typeof p.blurOn === 'boolean') {
          this.blurOn = p.blurOn;
          this.setPillState(this.btnBlur, this.blurOn);
          this.blurRow.style.display = this.blurOn ? 'flex' : 'none';
        }
        if (typeof p.blurVA === 'number' && p.blurVA >= 0.05 && p.blurVA <= 0.3) {
          this.blurVA = p.blurVA;
          this.blurSlider.value = Math.round(p.blurVA * 1000);
          this.blurVal.textContent = p.blurVA.toFixed(3);
        }
        if (typeof p.etOn === 'boolean') {
          this.etOn = p.etOn;
        }
        if (typeof p.cameraDeviceId === 'string') {
          this._preferredCameraDeviceId = p.cameraDeviceId;
        }
      },

      /** Apply settings encoded in location.hash on top of whatever
       *  restorePrefs already set. Hash wins over localStorage so a
       *  shared link reproduces the sender's view even if the recipient
       *  has different prefs saved. Camera deviceId is intentionally
       *  excluded (not portable across devices); locale is honored via
       *  the same localStorage override path the language selector uses
       *  so subsequent sessions remember it. Each value is validated
       *  the same way restorePrefs validates the localStorage shape. */
      restoreFromURL() {
        const h = parseHashParams();
        if (h.g === '1' || h.g === '0') {
          this.grayscaleOn = h.g === '1';
          this.setPillState(this.btnGray, this.grayscaleOn);
        }
        if (h.gm === 'scotopic' || h.gm === 'rec601') {
          this.grayMode = h.gm;
          this.grayModeSelect.value = h.gm;
        }
        if (h.b === '1' || h.b === '0') {
          this.blurOn = h.b === '1';
          this.setPillState(this.btnBlur, this.blurOn);
          this.blurRow.style.display = this.blurOn ? 'flex' : 'none';
        }
        if (h.va) {
          const va = parseFloat(h.va);
          if (Number.isFinite(va) && va >= 0.05 && va <= 0.3) {
            this.blurVA = va;
            this.blurSlider.value = Math.round(va * 1000);
            this.blurVal.textContent = va.toFixed(3);
          }
        }
        if (h.et === '1' || h.et === '0') {
          this.etOn = h.et === '1';
        }
        if (h.l === 'auto' || h.l === 'en' || h.l === 'cs') {
          try {
            if (h.l === 'auto') localStorage.removeItem(LOCALE_STORAGE_KEY);
            else localStorage.setItem(LOCALE_STORAGE_KEY, h.l);
          } catch (e) { /* private mode */ }
        }
      },

      /** Encode the current shareable state into location.hash via
       *  history.replaceState (so it doesn't pile up history entries
       *  when the user toggles a pill). Camera selection is excluded
       *  -- deviceIds aren't portable across devices, so encoding one
       *  in a URL would actively mislead the recipient. */
      syncURLHash() {
        const params = new URLSearchParams();
        params.set('g', this.grayscaleOn ? '1' : '0');
        params.set('gm', this.grayMode);
        params.set('b', this.blurOn ? '1' : '0');
        params.set('va', this.blurVA.toFixed(3));
        params.set('et', this.etOn ? '1' : '0');
        params.set('l', readLocaleOverride() || 'auto');
        const hash = '#' + params.toString();
        if (location.hash === hash) return;
        history.replaceState(null, '', location.pathname + location.search + hash);
      },

      toggleGrayscale() {
        this.grayscaleOn = !this.grayscaleOn;
        this.setPillState(this.btnGray, this.grayscaleOn);
        this.renderFrame();
        this.persistPrefs();
      },

      onGrayModeChange() {
        this.grayMode = this.grayModeSelect.value;
        this.renderFrame();
        this.persistPrefs();
      },

      toggleBlur() {
        this.blurOn = !this.blurOn;
        this.setPillState(this.btnBlur, this.blurOn);
        this.blurRow.style.display = this.blurOn ? 'flex' : 'none';
        this.renderFrame();
        this.persistPrefs();
      },

      onBlurChange() {
        this.blurVA = parseInt(this.blurSlider.value, 10) / 1000;
        this.blurVal.textContent = this.blurVA.toFixed(3);
        this.renderFrame();
        this.persistPrefs();
      },

      toggleFreeze() {
        this.frozen = !this.frozen;
        this.setPillState(this.btnFreeze, this.frozen);
        this.btnPhoto.classList.toggle('hidden', !this.frozen);
        if (this.frozen) {
          if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
        } else {
          this.processFrame();
        }
      },

      /** Re-render synchronously and capture the current canvas to a PNG.
       *  WebGL is initialised without preserveDrawingBuffer, so the back
       *  buffer is only guaranteed to survive long enough for toBlob if
       *  we redraw immediately before the call within the same task. */
      savePhoto() {
        if (!this.gl || !this.blurProgram) return;
        this.renderFrame();
        const filename = 'achromat-' + this.captureTimestamp() + '.png';
        this.canvas.toBlob((blob) => {
          if (!blob) { this.showError('errShareFailed'); return; }
          this.shareBlob(blob, filename).catch(() => this.showError('errShareFailed'));
        }, 'image/png');
      },

      /** ISO-ish timestamp safe for filenames on every OS (no colons). */
      captureTimestamp() {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
          + '_' + pad(d.getHours()) + '-' + pad(d.getMinutes()) + '-' + pad(d.getSeconds());
      },

      /** Web Share with files where supported, else trigger a hidden
       *  <a download>. Treats user cancellation as success (no error). */
      async shareBlob(blob, filename) {
        const file = new File([blob], filename, { type: blob.type });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file] });
            return;
          } catch (e) {
            if (e && e.name === 'AbortError') return;
            // Fall through to the download path on any other share error.
          }
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          a.remove();
          URL.revokeObjectURL(url);
        }, 0);
      },

      /** Internal-canvas-pixel sigma for the blur shader, derived from
       *  the visual-acuity slider.
       *
       *  K = 0.3 was originally calibrated against CSS filter: blur(N px)
       *  -- where N is in CSS-display pixels -- so the natural unit of
       *  the formula is display pixels:
       *    sigma_display = (1/VA - 1) * K
       *  The canvas is laid out at 100vw / 100vh with object-fit: cover,
       *  so one internal pixel renders as
       *    s = max(clientW/w, clientH/h)
       *  display pixels (cover takes the larger ratio so content fills
       *  the box). The shader operates in internal pixels, so we convert:
       *    sigma_internal = sigma_display / s
       *                   = sigma_display * min(w/clientW, h/clientH)
       *  Without this correction the shader looked ~1.5-2x weaker than
       *  the CSS reference on typical desktop layouts. */
      getBlurSigma() {
        const K = 0.3;
        const sigmaDisplay = (1 / this.blurVA - 1) * K;
        const cw = this.canvas.clientWidth, ch = this.canvas.clientHeight;
        const w = this.canvas.width, h = this.canvas.height;
        if (!cw || !ch || !w || !h) return sigmaDisplay;
        const mult = Math.min(w / cw, h / ch);
        return sigmaDisplay * mult;
      },

      /** Activate the diagnostics HUD when ?debug=1 is in the URL. The
       *  flag is read once at boot; toggling it requires a reload. The
       *  HUD updates at ~1 Hz, which is plenty for human-readable
       *  numbers and avoids piling work on every frame. FPS is computed
       *  from a per-second sliding window seeded from processFrame. */
      initDebug() {
        const params = new URLSearchParams(window.location.search);
        const v = params.get('debug');
        const on = v !== null && v !== '0' && v.toLowerCase() !== 'false';
        if (!on) return;
        this._debugOn = true;
        this._fpsT0 = performance.now();
        this.debugEl.hidden = false;
        this.updateDebugHUD();
        this._debugIntervalId = setInterval(() => this.updateDebugHUD(), 1000);
      },

      /** Refresh the diagnostics HUD content. Lines that don't apply to
       *  the current capability set (Glare on iOS, ISO on cameras that
       *  don't expose it) are silently skipped so the HUD stays terse. */
      updateDebugHUD() {
        if (!this._debugOn) return;
        const now = performance.now();
        const elapsed = now - this._fpsT0;
        if (elapsed >= 500) {
          this._fpsCurrent = (this._fpsCount * 1000) / elapsed;
          this._fpsCount = 0;
          this._fpsT0 = now;
        }

        const c = this.canvas;
        const dpr = window.devicePixelRatio || 1;
        const sigma = (this.blurOn && this.blurSrcFbos.length) ? this.getBlurSigma() : 0;
        const lines = [];
        lines.push(`canvas ${c.width}x${c.height} / css ${c.clientWidth}x${c.clientHeight} (DPR ${dpr.toFixed(2)})`);
        if (this.blurOn && sigma > 0) {
          const level = this._pickBlurLevel(sigma);
          const sigmaAtLevel = sigma / (1 << level);
          const lw = Math.max(1, c.width >> level), lh = Math.max(1, c.height >> level);
          lines.push(`blur VA=${this.blurVA.toFixed(3)} \u03c3=${sigma.toFixed(2)}px L=${level} (${lw}x${lh}) \u03c3@L=${sigmaAtLevel.toFixed(2)}`);
        } else {
          lines.push(`blur off`);
        }
        lines.push(`fps ${this._fpsCurrent.toFixed(1)}`);
        if (this.supportsET) {
          const et = this.manualET ? `${this.manualET}\u00b5s` : 'pending';
          const iso = this.supportsISO ? `ISO ${this.getFixedISO()}` : 'ISO n/a';
          lines.push(`glare ${this.etOn ? 'on' : 'off'} \u00b7 ET ${et} \u00b7 ${iso}`);
          if (this.etOn && this._lastMeasuredLum >= 0) {
            lines.push(`lum ${this._lastMeasuredLum.toFixed(3)} target ${this.AE_TARGET.toFixed(2)}`);
          }
        }
        const cam = this.cameras[this.cameraIndex];
        if (cam) {
          const label = cam.label || `camera ${this.cameraIndex}`;
          lines.push(`cam ${label}`);
        }
        this.debugEl.textContent = lines.join('\n');
      },

      initFullscreen() {
        const fsEnabled = document.fullscreenEnabled || document.webkitFullscreenEnabled;
        if (!fsEnabled) return;
        this.btnFS.classList.remove('hidden');
        document.addEventListener('fullscreenchange', () => this.syncFullscreenState());
        document.addEventListener('webkitfullscreenchange', () => this.syncFullscreenState());
      },

      isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      },

      syncFullscreenState() {
        this.setPillState(this.btnFS, this.isFullscreen());
      },

      toggleFullscreen() {
        try {
          if (this.isFullscreen()) {
            const exit = document.exitFullscreen || document.webkitExitFullscreen;
            const result = exit.call(document);
            if (result && typeof result.catch === 'function') result.catch(() => {});
          } else {
            const el = document.documentElement;
            const request = el.requestFullscreen || el.webkitRequestFullscreen;
            const result = request.call(el);
            if (result && typeof result.catch === 'function') result.catch(() => {});
          }
        } catch (e) { /* old WebKit may throw synchronously */ }
      },

      setSettingsOpen(open) {
        this.settingsOpen = open;
        if (open) {
          const rect = this.btnSettings.getBoundingClientRect();
          this.settingsPanel.style.top = (rect.bottom + 6) + 'px';
        }
        this.settingsPanel.style.display = open ? 'flex' : 'none';
        this.setPillState(this.btnSettings, open);
        this.btnSettings.setAttribute('aria-expanded', open ? 'true' : 'false');
      },

      toggleSettings() { this.setSettingsOpen(!this.settingsOpen); },
      closeSettings()  { if (this.settingsOpen) this.setSettingsOpen(false); },

      onLanguageChange() {
        const v = this.langSelect.value;
        try {
          if (v === 'auto') {
            localStorage.removeItem(LOCALE_STORAGE_KEY);
          } else {
            localStorage.setItem(LOCALE_STORAGE_KEY, v);
          }
        } catch (e) { /* private mode */ }
        this.applyLocale();
        this.syncURLHash();
      },

      applyLocale() {
        const effective = getEffectiveLocale();
        this.strings = I18N[effective] || I18N.en;
        const t = this.strings;
        document.documentElement.lang = effective;
        document.title = t.title;
        this.btnGray.textContent = t.grayscale;
        this.btnGray.title = t.grayscaleTitle;
        this.btnBlur.textContent = t.blur;
        this.btnFreeze.textContent = t.freeze;
        this.btnFreeze.title = t.freezeTitle;
        this.btnPhoto.textContent = t.photo;
        this.btnPhoto.title = t.photoTitle;
        this.btnET.textContent = t.glare;
        this.btnET.title = t.glareTitle;
        this.btnFS.textContent = t.fullscreen;
        this.btnFS.title = t.fullscreenTitle;
        this.btnSettings.title = t.settingsTitle;
        this.btnSettings.setAttribute('aria-label', t.settingsTitle);
        document.getElementById('label-gray-type').textContent = t.grayType;
        document.getElementById('label-language').textContent = t.langLabel;
        document.getElementById('label-camera').textContent = t.camera;
        document.getElementById('label-sharpness').textContent = t.sharpness;
        const optS = this.grayModeSelect.querySelector('option[value="scotopic"]');
        const optR = this.grayModeSelect.querySelector('option[value="rec601"]');
        if (optS) optS.textContent = t.grayScience;
        if (optR) optR.textContent = t.grayPlain;
        const optAuto = this.langSelect.querySelector('option[value="auto"]');
        const optEn   = this.langSelect.querySelector('option[value="en"]');
        const optCs   = this.langSelect.querySelector('option[value="cs"]');
        if (optAuto) optAuto.textContent = t.langAuto;
        if (optEn)   optEn.textContent = t.langEn;
        if (optCs)   optCs.textContent = t.langCs;
        this.langSelect.value = readLocaleOverride() || 'auto';
        if (this._lastErrorKey) {
          this.showError(this._lastErrorKey, ...this._lastErrorParams);
        }
      },

      showError(msgKey, ...params) {
        const t = this.strings || I18N.en;
        const known = Object.prototype.hasOwnProperty.call(t, msgKey);
        let fmt = known ? t[msgKey] : msgKey;
        for (let i = 0; i < params.length; i++) {
          fmt = fmt.split('{' + i + '}').join(String(params[i]));
        }
        this._lastErrorKey = msgKey;
        this._lastErrorParams = params;
        this.errorDiv.textContent = fmt;
        this.errorDiv.style.display = 'block';
        console.error(fmt);
      },

      async acquireWakeLock() {
        if (!navigator.wakeLock) return;
        try {
          this._wakeLock = await navigator.wakeLock.request('screen');
          this._wakeLock.addEventListener('release', () => { this._wakeLock = null; });
        } catch (e) { /* permission denied or not supported */ }
      },

      releaseWakeLock() {
        if (this._wakeLock) {
          this._wakeLock.release().catch(() => {});
          this._wakeLock = null;
        }
      },

      /** Stop the render loop, release the camera, and drop the wake lock.
       *  Called when the page is hidden and on unload. Safe to call repeatedly. */
      suspend() {
        if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
        if (this.stream) {
          this.stream.getTracks().forEach(t => t.stop());
          this.stream = null;
          this.track = null;
          this.video.srcObject = null;
        }
        this.releaseWakeLock();
      },

      /** Re-acquire the camera (preferring the previously-selected device) and
       *  restart the render loop. No-op if already running. */
      async resume() {
        if (this.stream || this.rafId || this._resumePending) return;
        this._resumePending = true;
        try {
          const deviceId = this.cameras[this.cameraIndex]?.deviceId;
          const stream = await navigator.mediaDevices.getUserMedia({
            video: deviceId
              ? { deviceId: { exact: deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } }
              : { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
          });
          if (document.hidden) {
            stream.getTracks().forEach(t => t.stop());
            return;
          }
          await this.attachAndPrepareStream(stream);
          this.processFrame();
          this.acquireWakeLock();
        } catch (err) {
          if (!document.hidden) this.showError('errCameraFailed', err.message);
        } finally {
          this._resumePending = false;
        }
      },
    };

    sim.restorePrefs();
    sim.restoreFromURL();
    sim.applyLocale();
    sim.syncURLHash();
    sim.initFullscreen();
    sim.initDebug();

    sim.btnGray.addEventListener('click', () => sim.toggleGrayscale());
    sim.btnET.addEventListener('click', () => sim.toggleET());
    sim.btnBlur.addEventListener('click', () => sim.toggleBlur());
    sim.btnFreeze.addEventListener('click', () => sim.toggleFreeze());
    sim.btnPhoto.addEventListener('click', () => sim.savePhoto());
    sim.btnFS.addEventListener('click', () => sim.toggleFullscreen());
    sim.btnSettings.addEventListener('click', () => sim.toggleSettings());
    sim.camSelect.addEventListener('change', () => sim.onCameraSelectChange());
    sim.blurSlider.addEventListener('input', () => sim.onBlurChange());
    sim.grayModeSelect.addEventListener('change', () => sim.onGrayModeChange());
    sim.langSelect.addEventListener('change', () => sim.onLanguageChange());
    document.addEventListener('click', (e) => {
      if (!sim.settingsOpen) return;
      if (sim.settingsPanel.contains(e.target) || sim.btnSettings.contains(e.target)) return;
      sim.closeSettings();
    });

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        sim.updateCanvasSize();
        // Display-pixel sigma changes with the layout box, so redraw
        // even if rAF is paused (frozen, suspended, etc.).
        if (!sim.rafId) sim.renderFrame();
      }, 100);
    });
    window.addEventListener('unload', () => sim.suspend());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) sim.suspend();
      else sim.resume();
    });

    sim.start();
  </script>
</body>
</html>
